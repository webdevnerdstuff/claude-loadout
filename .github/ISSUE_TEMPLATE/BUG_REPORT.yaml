name: Bug Report
description: File a bug report
title: "[Bug Report]: "
labels: ["bug", "triage"]
assignees:
  - webdevnerdstuff
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: loadout-version
    attributes:
      label: loadout Version
      description: The `version` in the plugin's `.claude-plugin/plugin.json`, or the one `claude plugin list` shows.
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code Version
      description: What `claude --version` prints.
    validations:
      required: true
  - type: input
    id: claude-desktop-version
    attributes:
      label: Claude Desktop Version
      description: From Claude > About Claude.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: What `sw_vers -productVersion` prints.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where it went wrong
      multiple: true
      options:
        - The pane did not open
        - A skill is missing from the list
        - A skill is listed that should not be
        - A skill shows the wrong description, source or OFF state
        - The synced account skills are missing or out of date
        - A flag under Issues is wrong
        - Open in VS Code or Insert did nothing
        - Something else
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: What happened? Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which steps do we need to take to reproduce this error?
      placeholder: "Steps to reproduce the behavior:\n1. Run '/loadout'\n2. Click '...'\n3. See '....'"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Any `loadout:` line from the transcript, and the path of the skill's folder. Remove anything private first. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/webdevnerdstuff/claude-loadout/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
